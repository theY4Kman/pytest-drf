[tox]
isolated_build = true
envlist =
    py310-pytest{62,70,71,84,90}-django52
    py{311,312,313}-pytest{71,84,90}-django52
    py314-pytest90-django52

    py310-pytest84-django32
    py{312,313,314}-pytest90-django60


[testenv]
allowlist_externals = poetry
deps =
    pytest62: pytest>=6.2,<6.3
    pytest70: pytest>=7.0,<7.1
    pytest71: pytest>=7.1,<7.2
    pytest84: pytest>=8.4,<8.5
    pytest90: pytest>=9.0,<10

    django32: Django>=3.2,<3.3
    django52: Django>=5.2.8,<5.3
    django60: Django>=6.0,<6.1

install_command =
  {toxinidir}/_tox_install_command.sh {opts} {packages}

commands = poetry run pytest
